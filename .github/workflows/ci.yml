name: CI

'on':
  push:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - PYTHON: 'C:\Python27'
            ffmpeg_platform: win32
          - PYTHON: 'C:\Python27-x64'
            ffmpeg_platform: win64
          - PYTHON: 'C:\Python34'
            ffmpeg_platform: win32
          - PYTHON: 'C:\Python34-x64'
            ffmpeg_platform: win64
          - PYTHON: 'C:\Python35'
            ffmpeg_platform: win32
          - PYTHON: 'C:\Python35-x64'
            ffmpeg_platform: win64
          - PYTHON: 'C:\Python35'
            ffmpeg_platform: win32
          - PYTHON: 'C:\Python35-x64'
            ffmpeg_platform: win64
          - PYTHON: 'C:\Python36'
            ffmpeg_platform: win32
          - PYTHON: 'C:\Python36-x64'
            ffmpeg_platform: win64
          - PYTHON: 'C:\Python37'
            ffmpeg_platform: win32
          - PYTHON: 'C:\Python37-x64'
            ffmpeg_platform: win64
    env:
      CMD_IN_ENV: "cmd /E:ON /V:ON /C obvci_appveyor_python_build_env.cmd"
      ffmpeg_download: "https://ffmpeg.zeranoe.com/builds/"
      ffmpeg_version: "latest"
      PYTHON: ${{ matrix.PYTHON }}
      ffmpeg_platform: ${{ matrix.ffmpeg_platform }}
    steps:
      - uses: actions/checkout@v4
      - run: Start-FileDownload $env:ffmpeg_download$env:ffmpeg_platform/static/ffmpeg-$env:ffmpeg_version-$env:ffmpeg_platform-static.zip
        shell: powershell
      - run: 7z x ffmpeg-%ffmpeg_version%-%ffmpeg_platform%-static.zip
        shell: cmd
      - run: PATH=%PATH%;%cd%\ffmpeg-%ffmpeg_version%-%ffmpeg_platform%-static\bin
        shell: cmd
      - run: SET PATH=%PYTHON%;%PYTHON%\\Scripts;%PATH%
        shell: cmd
      - run: python -m pip install --disable-pip-version-check --user --upgrade pip
        shell: cmd
      - run: pip install -U setuptools pytest
        shell: cmd
      - run: pip install coverage pytest-cov codecov
        shell: cmd
      - run: python setup.py install
        shell: cmd
      - run: python setup.py test
        shell: cmd